<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>신상 소식 캐러셀 만들기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; background: #e9e7e3; color: #141312; }
  .bar { position: sticky; top: 0; z-index: 9; background: #141312; color: #fff; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar b { font-size: 14px; }
  .bar select, .bar button { font: inherit; font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 8px; border: 0; }
  .bar button { background: #ffe14d; cursor: pointer; }
  .bar small { opacity: .75; font-size: 12px; }
  .cap { margin: 12px 16px 0; background: #fff; border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .cap b { display: block; margin-bottom: 4px; }
  .wrap { display: flex; flex-wrap: wrap; gap: 18px; padding: 16px; justify-content: center; }
  .cell { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .cell .ctl { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .cell .ctl button { font: inherit; font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 8px; border: 1px solid #141312; background: #fff; cursor: pointer; }
  .frame { width: 324px; height: 405px; overflow: hidden; border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
  .slide { width: 1080px; height: 1350px; transform: scale(.3); transform-origin: 0 0; position: relative; overflow: hidden; background: #ddd; }
  .slide img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slide .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.18) 62%, rgba(0,0,0,.62) 100%); }
  .slide .logo { position: absolute; left: 64px; top: 64px; font-size: 26px; font-weight: 800; letter-spacing: .5px; color: #fff; mix-blend-mode: difference; }
  .slide .tx { position: absolute; left: 64px; right: 64px; bottom: 96px; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .slide .tx h2 { font-size: 54px; line-height: 1.22; font-weight: 900; letter-spacing: -2px; white-space: pre-line; outline: none; }
  .slide.cover .tx h2 { font-size: 84px; line-height: 1.15; letter-spacing: -3px; }
  .slide .tx p { margin-top: 18px; font-size: 32px; line-height: 1.5; font-weight: 500; opacity: .95; white-space: pre-line; outline: none; }
  .tip { text-align: center; font-size: 12px; color: #6b665e; padding: 0 16px 20px; }
</style>
</head>
<body>
<div class="bar"><b>신상 소식 캐러셀</b><select id="pick"></select><button id="all">전체 PNG 저장</button><small id="st">불러오는 중…</small></div>
<div class="cap" id="cap"></div>
<div class="wrap" id="wrap"></div>
<p class="tip">글자를 눌러서 바로 고칠 수 있어요 · "사진 바꾸기"는 같은 상품의 다른 사진으로 바뀌어요</p>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
(async () => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const img = (u) => !u ? "" : /^https:\/\/image\.msscdn\.net\//.test(u) ? "/api/mimg?u=" + encodeURIComponent(u.split("?")[0]) : u;
  const K = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNidXlkamt2dnpibHV5b2hka2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjYxMDIsImV4cCI6MjEwNTIwMjEwMn0.dYpj7w5zpyrWeF4YgQ19U6rN3x0pxZwVo8QNiosV4KI";
  const r = await fetch("https://cbuydjkvvzbluyohdkie.supabase.co/rest/v1/site_data?id=eq.news&select=value", { headers: { apikey: K, Authorization: "Bearer " + K } });
  const NEWS = ((await r.json())[0] || {}).value || { posts: [] };
  const posts = NEWS.posts || [];
  if (!posts.length) { $("#st").textContent = "아직 만든 소식이 없어요"; return; }
  $("#pick").innerHTML = posts.map((p, i) => `<option value="${i}">${esc(p.date || "")} · ${esc(p.title || "")}</option>`).join("");
  let P = posts[0]; const k = {};
  const draw = () => {
    const S = P.slides || [];
    $("#cap").innerHTML = `<b>캡션 (복사해서 쓰기)</b>${esc(P.caption || "")}`;
    $("#wrap").innerHTML = S.map((s, i) => `<div class="cell"><div class="frame"><div class="slide${i === 0 ? " cover" : ""}">
        <img class="bg" src="${esc(img((s.imgs || [])[k[i] || 0] || s.img))}" crossorigin="anonymous"><div class="shade"></div>
        <p class="logo">MD STUDIO</p>
        <div class="tx"><h2 contenteditable="true">${esc(s.title)}</h2>${s.body ? `<p contenteditable="true">${esc(s.body)}</p>` : ""}</div>
      </div></div><div class="ctl"><span>${i + 1}/${S.length}</span>${(s.imgs || []).length > 1 ? `<button data-sw="${i}">사진 바꾸기</button>` : ""}<button data-dl="${i}">PNG 저장</button></div></div>`).join("");
    $("#st").textContent = `${S.length}장`;
  };
  $("#pick").onchange = () => { P = posts[+$("#pick").value]; Object.keys(k).forEach((x) => delete k[x]); draw(); };
  const save = async (i) => {
    const el = $("#wrap").querySelectorAll(".slide")[i];
    const url = await htmlToImage.toPng(el, { width: 1080, height: 1350, pixelRatio: 1, style: { transform: "none" }, cacheBust: true });
    const a = document.createElement("a"); a.href = url; a.download = `mdstudio_news_${(P.date || "").replace(/\D/g, "")}_${String(i + 1).padStart(2, "0")}.png`; a.click();
  };
  $("#wrap").onclick = async (e) => {
    const sw = e.target.closest("[data-sw]"); if (sw) { const i = +sw.dataset.sw; const n = (P.slides[i].imgs || []).length; k[i] = ((k[i] || 0) + 1) % n; $("#wrap").querySelectorAll(".slide")[i].querySelector("img.bg").src = img(P.slides[i].imgs[k[i]]); return; }
    const dl = e.target.closest("[data-dl]"); if (dl) { dl.textContent = "저장 중…"; try { await save(+dl.dataset.dl); dl.textContent = "저장됨 ✓"; } catch (er) { dl.textContent = "실패"; } }
  };
  $("#all").onclick = async () => { const n = $("#wrap").querySelectorAll(".slide").length; for (let i = 0; i < n; i++) { await save(i); await new Promise((r) => setTimeout(r, 400)); } };
  draw();
})();
</script>
</body>
</html>
