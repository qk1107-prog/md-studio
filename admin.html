<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD STUDIO 관리자</title>

<body>
<div id="app-root"></div>

<style>
/* ================= 관리자 전용 스타일 ================= */

  #app-root {
    --bg: #faf8f4;
    --fg: #191817;
    --fg-muted: #85807a;
    --line: #e8e4dc;
    --accent: #ff5a2e;
    --tag-bg: #f4f1ea;
    --danger: #d64545;

    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    min-height: 100vh;
    line-height: 1.5;
  }
  #app-root * { box-sizing: border-box; }

  /* ---------- Login ---------- */
  #app-root .login-wrap {
    max-width: 360px;
    margin: 80px auto;
    padding: 0 20px;
  }
  #app-root .login-card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 32px 28px;
  }
  #app-root .login-card h1 {
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 4px;
  }
  #app-root .login-card .sub {
    font-size: 13px;
    color: var(--fg-muted);
    margin: 0 0 24px;
  }
  #app-root .field { margin-bottom: 14px; }
  #app-root .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--fg-muted);
    margin-bottom: 6px;
  }
  #app-root .field input,
  #app-root .field textarea,
  #app-root .field select {
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    color: var(--fg);
    padding: 10px 12px;
    border-radius: 8px;
    font: inherit;
    font-size: 14px;
  }
  #app-root .field textarea { resize: vertical; min-height: 64px; }
  #app-root .err { color: var(--danger); font-size: 13px; margin: 0 0 12px; }
  #app-root .btn {
    background: var(--fg);
    color: #fff;
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
  }
  #app-root .btn.block { width: 100%; }
  #app-root .btn.accent { background: var(--accent); }
  #app-root .btn.danger { background: none; color: var(--danger); font-weight: 700; padding: 6px 10px; }
  #app-root .btn.ghost { background: none; border: 1px solid var(--line); color: var(--fg); }

  /* ---------- Admin shell ---------- */
  #app-root .shell { display: flex; min-height: 100vh; }
  #app-root .side {
    width: 190px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid var(--line);
    padding: 20px 12px;
  }
  #app-root .side .brand {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 0 10px 18px;
  }
  #app-root .side button.nav-item {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--fg-muted);
    cursor: pointer;
    margin-bottom: 2px;
  }
  #app-root .side button.nav-item.active { background: var(--tag-bg); color: var(--fg); }
  #app-root .side .logout {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  #app-root .main { flex: 1; min-width: 0; padding: 28px 34px 60px; max-width: 780px; }
  #app-root .page-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  #app-root .page-sub { font-size: 13px; color: var(--fg-muted); margin: 0 0 24px; }

  #app-root .panel {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 20px;
  }
  #app-root .panel h2 { font-size: 15px; font-weight: 800; margin: 0 0 16px; }
  #app-root .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  #app-root .row-flex { display: flex; gap: 10px; align-items: flex-end; }
  #app-root .row-flex .field { flex: 1; margin-bottom: 0; }

  /* item list rows */
  #app-root .item-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  #app-root .item-row:last-child { border-bottom: none; }
  #app-root .item-row.drag-row { cursor: grab; }
  #app-root .item-row.drag-row.dragging { opacity: 0.35; }
  #app-root .drag-handle { color: var(--fg-muted); font-size: 15px; flex-shrink: 0; cursor: grab; user-select: none; }
  #app-root .item-row img.thumb,
  #app-root .item-row .thumb-ph {
    width: 46px;
    height: 58px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--tag-bg);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--fg-muted);
  }
  #app-root .item-row .info { flex: 1; min-width: 0; }
  #app-root .item-row .info .t1 { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app-root .item-row .info .t2 { font-size: 11.5px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #app-root .tag-chip {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--tag-bg);
    color: var(--fg-muted);
    margin-right: 6px;
  }

  #app-root .subgroup-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 18px 0 8px;
    font-size: 13px;
    font-weight: 800;
  }
  #app-root .subgroup-title:first-child { margin-top: 0; }
  #app-root .empty-note { font-size: 12.5px; color: var(--fg-muted); padding: 6px 0 4px; }

  #app-root .cat-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  #app-root .cat-row select { flex: 0 0 96px; }
  #app-root .cat-row input { flex: 1; }
  #app-root .cat-row .rm { background: none; border: none; color: var(--danger); font-size: 16px; cursor: pointer; padding: 0 4px; }

  #app-root .save-msg { font-size: 12.5px; color: var(--accent); font-weight: 700; margin-left: 10px; }
  #app-root .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--fg);
    color: #fff;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 100;
  }
  #app-root .toast.show { opacity: 1; }
  #app-root .loading { padding: 60px; text-align: center; color: var(--fg-muted); }

  /* ---------- 사진 자르기 모달 ---------- */
  .crop-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .crop-modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .crop-head { padding: 16px 20px 6px; font-size: 15px; font-weight: 800; color: #191817; }
  .crop-sub { padding: 0 20px 10px; font-size: 12px; color: #85807a; }
  .crop-stage { background: #111; height: 56vh; min-height: 300px; }
  .crop-stage img { max-width: 100%; display: block; }
  .crop-ratios { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 0; }
  .crop-ratios button {
    background: #f4f1ea; border: 1px solid #e8e4dc; color: #191817;
    font: inherit; font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 20px; cursor: pointer;
  }
  .crop-ratios button.active { background: #191817; color: #fff; border-color: #191817; }
  .crop-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px 18px; }
  .crop-actions button {
    font: inherit; font-size: 13.5px; font-weight: 700; padding: 10px 16px; border-radius: 8px; cursor: pointer; border: 1px solid #e8e4dc; background: #fff; color: #191817;
  }
  .crop-actions button.primary { background: #ff5a2e; border-color: #ff5a2e; color: #fff; }

  /* ---------- 일괄 등록 미리보기 ---------- */
  #app-root .bulk-box { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; background: #fff; }
  #app-root .msg-err { color: var(--danger); font-size: 12.5px; margin: 4px 0 0; line-height: 1.45; }
  #app-root .msg-warn { color: #a86a00; font-size: 12.5px; margin: 4px 0 0; line-height: 1.45; }
  #app-root .look-prev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
  #app-root .look-prev { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; font-size: 11.5px; }
  #app-root .look-prev img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
  #app-root .look-prev .lp-num { position: absolute; top: 6px; left: 6px; background: var(--fg); color: #fff; font-size: 12px; font-weight: 800; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  #app-root .ep-prev { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fff; }
  #app-root .ep-prev.bad { border-color: #f0b4b4; background: #fff8f8; }
  #app-root .ep-prev-head { display: flex; gap: 12px; align-items: flex-start; }
  #app-root .ep-prev-thumb { width: 54px; aspect-ratio: 9/16; border-radius: 6px; background: var(--tag-bg); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 9.5px; color: var(--fg-muted); text-align: center; line-height: 1.3; }
  #app-root .ep-prev-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #app-root .file-btn { display: inline-block; font-size: 12px; padding: 7px 12px; cursor: pointer; }
  #app-root .mini-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
  #app-root .mini-table td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: middle; }
  #app-root .ee-row { display: grid; grid-template-columns: 104px 1fr 1.6fr 34px; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  #app-root .ee-row .ee-link { grid-column: 2 / 3; }
  #app-root .ee-row .ee-img { grid-column: 3 / 4; }
  #app-root .ee-row input, #app-root .ee-row select { width: 100%; min-width: 0; font: inherit; font-size: 12.5px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--fg); }
  #app-root .ee-row .ee-rm { padding: 4px; grid-row: 1 / 3; grid-column: 4; }

  /* ---------- 휴대폰에서 관리자 화면 ---------- */
  @media (max-width: 720px) {
    #app-root .shell { flex-direction: column; }
    #app-root .side { width: auto; border-right: none; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; }
    #app-root .side .brand { width: 100%; padding: 0 6px 6px; }
    #app-root .side button.nav-item { width: auto; margin: 0; }
    #app-root .side .logout { width: 100%; margin-top: 6px; padding-top: 8px; }
    #app-root .main { padding: 18px 14px 60px; }
    #app-root .grid2 { grid-template-columns: 1fr; }
    #app-root .ee-row { grid-template-columns: 1fr 1fr 34px; }
    #app-root .ee-row .ee-label { grid-column: 1 / 3; }
    #app-root .ee-row .ee-name, #app-root .ee-row .ee-link, #app-root .ee-row .ee-img { grid-column: 1 / 3; }
    #app-root .ee-row .ee-rm { grid-row: 1; grid-column: 3; }
  }
</style>

<script>
// ============================================================
// Supabase 연결 설정
// ============================================================
const SUPABASE_URL = "https://cbuydjkvvzbluyohdkie.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNidXlkamt2dnpibHV5b2hka2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2MjYxMDIsImV4cCI6MjEwNTIwMjEwMn0.dYpj7w5zpyrWeF4YgQ19U6rN3x0pxZwVo8QNiosV4KI";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadSiteDataFromSupabase() {
  const { data, error } = await supabaseClient
    .from("site_data")
    .select("value")
    .eq("id", "main")
    .maybeSingle();
  if (error || !data) return null;
  return data.value;
}

async function saveSiteDataToSupabase(value) {
  const { error } = await supabaseClient
    .from("site_data")
    .upsert({ id: "main", value: value });
  return !error;
}
async function renderAdminApp(root) {
  // ============================================================
  // 어드민 로그인은 이제 Supabase Auth로 처리돼요 (아래 loadData 근처)
  // ============================================================

  const CAT_ORDER = ["OUTER", "TOP", "BOTTOM", "BAG", "SHOES", "ACC", "ETC"];

  const DEFAULT_DATA = {
    site: {
      brand: "MD STUDIO",
      name: "광만두",
      instagram: "your_instagram",
      bio: "매일 코디와 아이템을 공유합니다. 카드를 누르면 구매 페이지로 이동해요.",
      footer: "MD STUDIO x k__man_do",
      avatar: "",
    },
    lineup: [],
    outfitGroups: ["거울샷", "일상 컷"],
    outfits: [],
    picks: [
      { id: "g1", title: "지금 가장 잘나가는 추천템", sub: "요즘 문의 제일 많이 받는 아이템만 모았어요", items: [] },
      { id: "g2", title: "입문자를 위한 가성비 필수템", sub: "패션 처음이면 이것부터 사면 됩니다", items: [] },
      { id: "g3", title: "이번 주 신상 체크", sub: "새로 올라온 것 중에 눈여겨볼 것들", items: [] },
    ],
    categories: [
      { id: "c1", title: "아우터", sub: "요즘 많이 찾는 아우터 모음", items: [] },
      { id: "c2", title: "하의", sub: "핏 하나로 승부 보는 하의들", items: [] },
      { id: "c3", title: "신발", sub: "발밑까지 신경 쓴 신발 모음", items: [] },
    ],
    reels: [],
  };

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ============================================================
  // 사진 보관함(Supabase Storage "media")에 올리기
  // 사진을 데이터 안에 통째로 넣지 않고 파일로 따로 보관 → 사이트가 훨씬 가벼워져요
  // ============================================================
  function loadImageEl(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => resolve({ img, url });
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`사진을 읽을 수 없어요: ${file.name || ""} (아이폰 HEIC 사진이면 JPG로 바꿔주세요)`)); };
      img.src = url;
    });
  }
  async function compressImage(file, maxSide) {
    const { img, url } = await loadImageEl(file);
    let w = img.naturalWidth, h = img.naturalHeight;
    const scale = Math.min(1, maxSide / Math.max(w, h));
    w = Math.round(w * scale); h = Math.round(h * scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.86));
    if (!blob) throw new Error("사진 변환에 실패했어요");
    return { blob, ratio: `${w}/${h}` };
  }
  async function uploadBlob(blob, folder) {
    const n = new Date();
    const day = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}-${String(n.getDate()).padStart(2, "0")}`;
    const path = `${folder}/${day}/${uid()}.jpg`;
    const { error } = await supabaseClient.storage.from("media").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
    if (error) throw error;
    return supabaseClient.storage.from("media").getPublicUrl(path).data.publicUrl;
  }
  async function uploadImageFile(file, folder, maxSide) {
    const { blob, ratio } = await compressImage(file, maxSide || 1400);
    const url = await uploadBlob(blob, folder);
    return { url, ratio };
  }
  // 자르기 창에서 나온 사진(data:…)이면 보관함에 올리고 주소로 바꿔요. 실패하면 예전 방식 그대로 둬요.
  async function persistPhoto(src, folder) {
    if (!src || !String(src).startsWith("data:")) return src;
    try {
      const blob = await (await fetch(src)).blob();
      return await uploadBlob(blob, folder);
    } catch (e) {
      console.warn("사진 보관함 업로드 실패 — 데이터 안에 그대로 저장해요", e);
      return src;
    }
  }

  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // ============================================================
  // 사진 자르기 모달
  // opts.ratio  : 고정 비율 (예: 4/5). 없으면 자유 비율 + 프리셋 버튼 표시
  // opts.title  : 모달 제목
  // 반환값      : { dataUrl, ratio }  (취소하면 null)
  // ============================================================
  const RATIO_PRESETS = [
    { label: "자유", value: NaN },
    { label: "3:4", value: 3 / 4 },
    { label: "2:3", value: 2 / 3 },
    { label: "9:16", value: 9 / 16 },
    { label: "1:1", value: 1 },
    { label: "4:3", value: 4 / 3 },
  ];

  function openCropper(file, opts) {
    opts = opts || {};
    return new Promise(async (resolve) => {
      const srcUrl = await fileToDataUrl(file);
      const fixed = typeof opts.ratio === "number" && !isNaN(opts.ratio);

      const backdrop = document.createElement("div");
      backdrop.className = "crop-backdrop";
      backdrop.innerHTML = `
        <div class="crop-modal">
          <div class="crop-head">${opts.title || "사진 자르기"}</div>
          <div class="crop-sub">${fixed ? "네모를 드래그해서 보여줄 부분을 골라주세요. (모서리를 잡으면 크기 조절)" : "네모를 드래그하거나 모서리를 잡아 자유롭게 조절하세요. 아래 버튼으로 비율을 고정할 수도 있어요."}</div>
          <div class="crop-stage"><img id="crop-img" src="${srcUrl}"></div>
          ${fixed ? "" : `<div class="crop-ratios">${RATIO_PRESETS.map((p, i) => `<button type="button" data-i="${i}" class="${i === 0 ? "active" : ""}">${p.label}</button>`).join("")}</div>`}
          <div class="crop-actions">
            <button type="button" id="crop-cancel">취소</button>
            <button type="button" id="crop-ok" class="primary">이렇게 사용</button>
          </div>
        </div>
      `;
      document.body.appendChild(backdrop);

      const img = backdrop.querySelector("#crop-img");
      let cropper = null;
      const start = () => {
        cropper = new Cropper(img, {
          aspectRatio: fixed ? opts.ratio : NaN,
          viewMode: 1,
          autoCropArea: 1,
          background: false,
          responsive: true,
        });
      };
      if (img.complete) start(); else img.onload = start;

      backdrop.querySelectorAll(".crop-ratios button").forEach((b) => {
        b.addEventListener("click", () => {

  function flashDone(main, msg) {

  function armDelete(btn, onConfirm) {
    if (btn.dataset.armed === "1") {
      onConfirm();
      return;

    btn.dataset.armed = "1";
    const original = btn.textContent;
    btn.textContent = "정말 삭제?";

    setTimeout(() => {

    }, 3000);

  // 드래그로 순서 바꾸기 — container 안의 .drag-row 요소들을 대상으로 함
  function makeSortable(container, onReorder) {
    let dragEl = null;
    function getAfterElement(y) {
      const els = [...container.querySelectorAll(":scope > .drag-row:not(.dragging)")];
      return els.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) return { offset, element: child };
        return closest;
      }, { offset: -Infinity, element: null }).element;
    }
    container.querySelectorAll(":scope > .drag-row").forEach((row) => {
      row.setAttribute("draggable", "true");
      row.addEventListener("dragstart", () => {
        dragEl = row;
        setTimeout(() => row.classList.add("dragging"), 0);
      });
      row.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        dragEl = null;
        onReorder([...container.querySelectorAll(":scope > .drag-row")].map((r) => r.dataset.id));
      });
    });
    container.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (!dragEl) return;
      const afterEl = getAfterElement(e.clientY);
      if (afterEl == null) container.appendChild(dragEl);
      else container.insertBefore(dragEl, afterEl);
    });
  }

  // ============================================================
  // 엑셀 읽기 공통 도우미
  // ============================================================
  function normHeader(s) {
    return String(s == null ? "" : s).replace(/[\s‍️]/g, "").replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  }
  function cellAt(ws, r, c) { return ws[XLSX.utils.encode_cell({ r, c })]; }
  function cellText(ws, r, c) {
    const cell = cellAt(ws, r, c);
    if (!cell) return "";
    const v = cell.w != null ? cell.w : cell.v;
    return String(v == null ? "" : v).trim();
  }
  // 하이퍼링크가 걸린 칸(글자는 "링크"인데 실제 주소는 따로 있는 경우)까지 읽어요
  function cellLink(ws, r, c) {
    const cell = cellAt(ws, r, c);
    if (!cell) return "";
    if (cell.l && cell.l.Target && /^https?:\/\//i.test(cell.l.Target)) return cell.l.Target.trim();
    if (cell.f) {
      const m = String(cell.f).match(/HYPERLINK\(\s*"([^"]+)"/i);
      if (m) return m[1].trim();
    }
    return cellText(ws, r, c);
  }
  function ymd(y, m, d) {
    if (!y || !m || !d || m > 12 || d > 31) return "";
    return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  function cellDate(ws, r, c) {
    const cell = cellAt(ws, r, c);
    if (!cell) return "";
    if (cell.t === "n" && cell.v > 20000 && cell.v < 80000) {
      const d = XLSX.SSF.parse_date_code(cell.v);
      if (d) return ymd(d.y, d.m, d.d);
    }
    if (cell.v instanceof Date) return ymd(cell.v.getFullYear(), cell.v.getMonth() + 1, cell.v.getDate());
    const s = String(cell.w != null ? cell.w : cell.v).trim();
    let m = s.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
    if (m) return ymd(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
    if (m) return ymd(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{2})(\d{2})(\d{2})$/);
    if (m) return ymd(2000 + +m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
    if (m) return ymd(new Date().getFullYear(), +m[1], +m[2]);
    return "";
  }
  // 헤더 줄에서 각 열 위치 찾기 (못 찾으면 기본 위치 A, B, C…)
  function findCols(ws, headerRow, spec, defaults) {
    const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
    const heads = [];
    for (let c = range.s.c; c <= Math.min(range.e.c, 40); c++) heads.push({ c, h: normHeader(cellText(ws, headerRow, c)) });
    const used = new Set();
    const out = {};
    const keys = Object.keys(spec);
    keys.forEach((k) => {
      for (const cand of spec[k]) {
        const hit = heads.find((x) => !used.has(x.c) && x.h === cand);
        if (hit) { out[k] = hit.c; used.add(hit.c); return; }
      }
    });
    keys.forEach((k) => {
      if (out[k] != null) return;
      for (const cand of spec[k]) {
        const hit = heads.find((x) => !used.has(x.c) && x.h && x.h.includes(cand));
        if (hit) { out[k] = hit.c; used.add(hit.c); return; }
      }
    });
    keys.forEach((k) => { if (out[k] == null) out[k] = defaults[k]; });
    return out;
  }
  async function readWorkbook(file) {
    const buf = await file.arrayBuffer();
    return XLSX.read(buf, { type: "array", cellFormula: true, cellNF: true });
  }
  function friendlyError(err) {
    const msg = String((err && (err.message || err.error_description || err.error)) || err || "");
    if (/does not exist|42P01|schema cache/i.test(msg)) return "Supabase에 표가 아직 없어요. 안내드린 SQL을 먼저 실행해 주세요.";
    if (/row-level security|42501|permission|Unauthorized|not allowed/i.test(msg)) return "저장 권한이 없어요. 관리자 명단 SQL이 실행됐는지, 로그인이 풀리지 않았는지 확인해 주세요.";
    if (/bucket not found/i.test(msg)) return "사진 보관함(media)이 아직 없어요. 안내드린 SQL을 먼저 실행해 주세요.";
    if (/duplicate key|23505/i.test(msg)) return "같은 제목의 편이 이미 있어요. 제목을 바꿔 주세요.";
    if (/Failed to fetch|NetworkError/i.test(msg)) return "인터넷 연결이 불안정해요. 잠시 후 다시 시도해 주세요.";
    return msg || "알 수 없는 오류";
  }

      o.items[cat].forEach(([name, link, size]) => list.push({ cat, brand: "", name, link, size: size || "" }));
    });
    return list;
  }

  // ---------- 실착 일괄 등록 ----------
  function setupOutfitBulk(main) {
    let photoFiles = [];
    let sheetRows = null; // null = 엑셀 아직 안 고름
    let sheetName = "";
    const box = main.querySelector("#ob-preview");
    const objectUrls = [];

    main.querySelector("#ob-template").addEventListener("click", () => {
      const ws = XLSX.utils.aoa_to_sheet([
        ["실착 일괄 등록 양식 — 4행 제목은 그대로 두고 5행부터 적어주세요"],
        ["사진 파일 이름의 번호(1, 2, 3…)와 사진번호를 맞춰주세요. 한 코디에 옷이 여러 개면 같은 번호로 여러 줄."],
        [],
        ["사진번호", "브랜드", "옷 이름", "옷 링크", "사이즈"],
        [1, "아워데이즈", "세미 커브드 데님 팬츠", "https://...", "30"],
        [1, "웬즈데이", "오아시스 크롭 데님 셔츠", "https://...", "L"],
        [2, "뉴발란스", "ML2002RC", "https://...", "270"],
      ]);
      ws["!cols"] = [{ wch: 9 }, { wch: 16 }, { wch: 30 }, { wch: 40 }, { wch: 8 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "실착");
      XLSX.writeFile(wb, "실착-일괄등록-양식.xlsx");
    });

    main.querySelector("#ob-photos").addEventListener("change", (e) => {
      photoFiles = [...e.target.files];
      refresh();
    });
    main.querySelector("#ob-excel").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const wb = await readWorkbook(file);
        sheetName = wb.SheetNames[0];
        sheetRows = parseOutfitSheet(wb.Sheets[sheetName]);
      } catch (err) {
        sheetRows = [];
        toast("엑셀을 읽지 못했어요: " + friendlyError(err));
      }
      refresh();
    });

    function parseOutfitSheet(ws) {
      const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
      const cols = findCols(ws, 3,
        { num: ["사진번호", "번호", "no"], brand: ["브랜드"], link: ["옷링크", "큐레이터링크", "링크"], size: ["사이즈"], name: ["옷이름", "제품명", "상품명", "이름"] },
        { num: 0, brand: 1, name: 2, link: 3, size: 4 });
      const rows = [];
      for (let r = 4; r <= range.e.r; r++) {
        const numText = cellText(ws, r, cols.num);
        const brand = cellText(ws, r, cols.brand);
        const name = cellText(ws, r, cols.name);
        const link = cellLink(ws, r, cols.link);
        const size = cellText(ws, r, cols.size);
        if (!numText && !brand && !name && !link) continue;
        const m = numText.match(/\d+/);
        rows.push({ line: r + 1, num: m ? String(parseInt(m[0], 10)) : "", brand, name, link, size });
      }
      return rows;
    }

    function photoNum(file) {
      const stem = file.name.replace(/\.[^.]+$/, "");
      const m = stem.match(/^\s*(\d+)/) || stem.match(/(\d+)\s*$/);
      return m ? String(parseInt(m[1], 10)) : "";
    }

    let looks = [];
    function refresh() {
      objectUrls.splice(0).forEach((u) => URL.revokeObjectURL(u));
      looks = [];
      if (!photoFiles.length && sheetRows === null) { box.innerHTML = ""; return; }
      const warns = [];
      const errs = [];

      const photoMap = new Map();
      photoFiles.forEach((f) => {
        const n = photoNum(f);
        if (!n) { warns.push(`번호를 못 읽은 사진: ${f.name} (파일 이름을 숫자로 바꿔주세요)`); return; }
        if (photoMap.has(n)) { warns.push(`${n}번 사진이 2장 이상이에요 (${photoMap.get(n).name}, ${f.name}) — 첫 번째만 써요`); return; }
        photoMap.set(n, f);
      });

      const rowMap = new Map();
      (sheetRows || []).forEach((row) => {
        const problems = [];
        if (!row.num) problems.push("사진번호");
        if (!row.name) problems.push("옷 이름");
        if (!/^https?:\/\//i.test(row.link)) problems.push("옷 링크");
        if (problems.length) { errs.push(`${row.line}행: ${problems.join(", ")} 칸을 확인해주세요 → 이 줄은 빼고 등록해요`); return; }
        if (!rowMap.has(row.num)) rowMap.set(row.num, []);
        rowMap.get(row.num).push(row);
      });

      const nums = [...new Set([...photoMap.keys(), ...rowMap.keys()])].sort((a, b) => Number(a) - Number(b));
      const photoOnly = [], rowOnly = [];
      nums.forEach((n) => {
        const f = photoMap.get(n), rows = rowMap.get(n);
        if (f && rows) {
          const url = URL.createObjectURL(f);
          objectUrls.push(url);
          looks.push({ num: n, file: f, rows, url });
        } else if (f) photoOnly.push(n);
        else rowOnly.push(n);
      });
      if (sheetRows !== null && photoOnly.length) warns.push(`사진은 있는데 엑셀에 없는 번호: ${photoOnly.join(", ")} → 등록 안 해요`);
      if (photoFiles.length && rowOnly.length) warns.push(`엑셀엔 있는데 사진이 없는 번호: ${rowOnly.join(", ")} → 등록 안 해요`);

      const waiting = !photoFiles.length ? "① 코디 사진을 골라주세요." : sheetRows === null ? "② 엑셀 파일을 골라주세요." : "";
      box.innerHTML = `
        <div class="bulk-box">
          <p style="font-size:13px;font-weight:800;margin:0;">사진 ${photoFiles.length}장 · 엑셀 ${(sheetRows || []).length}줄${sheetName ? ` (시트: ${esc(sheetName)})` : ""} → 등록할 코디 <span style="color:var(--accent)">${looks.length}개</span></p>
          ${waiting ? `<p class="msg-warn">${waiting}</p>` : ""}
          ${errs.map((t) => `<p class="msg-err">⛔ ${esc(t)}</p>`).join("")}
          ${warns.map((t) => `<p class="msg-warn">⚠️ ${esc(t)}</p>`).join("")}
          ${looks.length ? `
            <div class="look-prev-grid">
              ${looks.map((l) => `
                <div class="look-prev">
                  <div style="position:relative;"><img src="${l.url}"><span class="lp-num">${l.num}</span></div>
                  <div style="padding:8px;">
                    ${l.rows.map((r) => `<p style="margin:0 0 4px;line-height:1.35;"><b>${esc(r.brand)}</b> ${esc(r.name)}${r.size ? ` <span style="color:var(--fg-muted)">(${esc(r.size)})</span>` : ""}</p>`).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
            <button class="btn accent" id="ob-commit" type="button" style="margin-top:12px;">${looks.length}개 등록하기</button>
            <span class="empty-note" id="ob-status" style="margin-left:8px;"></span>
          ` : ""}
        </div>
      `;
      const commit = box.querySelector("#ob-commit");
      if (commit) commit.addEventListener("click", () => commitLooks(commit));
    }

    async function commitLooks(btn) {
      const status = box.querySelector("#ob-status");
      const group = main.querySelector("#ob-group").value;
      btn.disabled = true;
      const created = [];
      try {
        for (let i = 0; i < looks.length; i++) {
          const l = looks[i];
          btn.textContent = `사진 올리는 중 ${i + 1}/${looks.length}…`;
          const up = await uploadImageFile(l.file, "looks", 1400);
          created.push({
            id: uid(), photo: up.url, ratio: up.ratio, group, items: {},
            pieces: l.rows.map((r) => ({ brand: r.brand, name: r.name, link: r.link, size: r.size })),
          });
        }
        btn.textContent = "저장 중…";
        const fresh = await loadData();
        fresh.outfits = created.concat(fresh.outfits || []);
        const ok = await saveSiteDataToSupabase(fresh);
        if (!ok) throw new Error("저장에 실패했어요");
      } catch (err) {
        btn.disabled = false;
        btn.textContent = `${looks.length}개 등록하기`;
        if (status) { status.textContent = "❌ " + friendlyError(err); status.style.color = "var(--danger)"; }
        toast("등록하지 못했어요: " + friendlyError(err));
        return;
      }
      DATA = await loadData();
      renderOutfitsPage(main);
      flashDone(main, `코디 ${created.length}개를 "${group}" 분류에 등록했어요`);
    }
  }

  // ============================================================
  // 4. 추천템 (편) — Supabase episodes / episode_items 표
  // ============================================================
  const EP_LABELS = ["국밥", "힙함", "남친룩", "옷쟁이"];
  const EP_EMOJI = { 국밥: "🍚", 힙함: "🔥", 남친룩: "🤍", 옷쟁이: "👑" };
  const EP_EXPECT = { 국밥: 9, 힙함: 9, 남친룩: 9, 옷쟁이: 3 };
  const EP_EXPECT_BRANDS = { 국밥: 3, 힙함: 3, 남친룩: 3, 옷쟁이: 1 };
  let EPISODES_CACHE = null;

  function normLabel(s) {
    s = String(s || "");
    if (s.includes("국밥") || s.includes("🍚")) return "국밥";
    if (s.includes("힙") || s.includes("🔥")) return "힙함";
    if (s.includes("남친") || s.includes("🤍")) return "남친룩";
    if (s.includes("옷쟁이") || s.includes("👑")) return "옷쟁이";
    return "";
  }
  function normSeries(s) {
    s = String(s || "");
    if (s.includes("가성비")) return "가성비";
    if (s.includes("가심비")) return "가심비";
    return "";
  }

  async function fetchEpisodes() {
    const { data, error } = await supabaseClient
      .from("episodes")
      .select("id,title,series,upload_date,reel_url,thumbnail_url,pick_comment,created_at,episode_items(count)")
      .order("upload_date", { ascending: false })
      .order("created_at", { ascending: false });
    if (error) throw error;
    return (data || []).map((e) => ({ ...e, itemCount: (e.episode_items && e.episode_items[0] && e.episode_items[0].count) || 0 }));
  }

  // 편 하나 저장 (같은 제목이면 덮어쓰기) — 제품은 통째로 교체
  async function saveEpisode(ep, items, thumbUrl, existingId) {
    const payload = {
      title: ep.title,
      series: ep.series,
      upload_date: ep.upload_date,
      reel_url: ep.reel_url || null,
      pick_comment: ep.pick_comment || null,
    };
    if (thumbUrl !== undefined) payload.thumbnail_url = thumbUrl;
    let row;
    if (existingId) {
      const { data, error } = await supabaseClient.from("episodes").update(payload).eq("id", existingId).select("id").single();
      if (error) throw error;
      row = data;
    } else {
      const { data, error } = await supabaseClient.from("episodes").upsert(payload, { onConflict: "title" }).select("id").single();
      if (error) throw error;
      row = data;
    }
    const del = await supabaseClient.from("episode_items").delete().eq("episode_id", row.id);
    if (del.error) throw del.error;
    if (items.length) {
      const ins = await supabaseClient.from("episode_items").insert(items.map((it, i) => ({
        episode_id: row.id,
        label: it.label,
        brand: it.brand,
        product_name: it.product_name,
        curator_url: it.curator_url,
        image_url: it.image_url || null,
        sort_order: i,
      })));
      if (ins.error) throw ins.error;
    }
    return row.id;
  }

  // 시트 하나 → 편 하나
  function parseEpisodeSheet(ws, sheetName) {
    const title = cellText(ws, 3, 1);
    const seriesRaw = cellText(ws, 4, 1);
    const dateTxt = cellText(ws, 5, 1);
    const upload_date = cellDate(ws, 5, 1);
    const reel_url = cellLink(ws, 6, 1);
    const pick_comment = cellText(ws, 7, 1);
    if (!title && !seriesRaw && !reel_url) return { skip: true, sheetName };

    const errors = [], warnings = [];
    const series = normSeries(seriesRaw) || normSeries(title);
    if (!title) errors.push("B4 제목이 비어 있어요");
    if (!series) errors.push(`B5 시리즈는 "가성비" 또는 "가심비"여야 해요 (지금: ${seriesRaw || "빈칸"})`);
    if (!upload_date) errors.push(`B6 업로드 날짜를 못 읽었어요 (지금: ${dateTxt || "빈칸"}) — 2026-11-16 형식으로 적어주세요`);
    if (reel_url && !/^https?:\/\//i.test(reel_url)) errors.push("B7 릴스 링크가 https:// 로 시작하지 않아요");
    if (!reel_url) warnings.push("B7 릴스 링크가 비어 있어요 (영상 다시 보기 버튼이 안 보여요)");
    if (!pick_comment) warnings.push("B8 옷쟁이 한마디가 비어 있어요");

    const range = XLSX.utils.decode_range(ws["!ref"] || "A1");
    const cols = findCols(ws, 9,
      { label: ["라벨", "구분", "섹션"], brand: ["브랜드"], name: ["제품명", "상품명", "이름"], link: ["큐레이터링크", "큐레이터"], image: ["사진링크", "이미지링크", "사진", "이미지"] },
      { label: 0, brand: 1, name: 2, link: 3, image: 4 });
    const items = [];
    let curLabel = "", curBrand = "";
    let noImage = 0;
    for (let r = 10; r <= range.e.r; r++) {
      const rawLabel = cellText(ws, r, cols.label);
      const brand = cellText(ws, r, cols.brand);
      const name = cellText(ws, r, cols.name);
      const link = cellLink(ws, r, cols.link);
      const image = cellLink(ws, r, cols.image);
      if (!rawLabel && !brand && !name && !link) continue;
      if (rawLabel) {
        const nl = normLabel(rawLabel);
        if (nl !== curLabel) curBrand = "";
        curLabel = nl || ("?" + rawLabel);
      }
      if (brand) curBrand = brand;
      if (!name && !link) continue; // 라벨만 적힌 줄(구분선)은 건너뛰기
      const line = r + 1;
      const it = { label: curLabel, brand: brand || curBrand, product_name: name, curator_url: link, image_url: "", line };
      if (!EP_LABELS.includes(it.label)) errors.push(`${line}행: 라벨을 못 읽었어요 (${rawLabel || "빈칸"}) — 국밥/힙함/남친룩/옷쟁이 중 하나`);
      if (!it.brand) errors.push(`${line}행: 브랜드가 비어 있어요`);
      if (!name) errors.push(`${line}행: 제품명이 비어 있어요`);
      if (!/^https?:\/\//i.test(link)) errors.push(`${line}행: 큐레이터 링크가 없거나 https:// 로 시작하지 않아요`);
      if (/^https?:\/\//i.test(image)) it.image_url = image; else noImage++;
      items.push(it);
    }
    if (noImage) warnings.push(`사진 링크가 없는 제품 ${noImage}개 (사이트에 "사진" 자리로 보여요)`);
    EP_LABELS.forEach((l) => {
      const list = items.filter((x) => x.label === l);
      const brands = new Set(list.map((x) => x.brand));
      if (list.length !== EP_EXPECT[l]) warnings.push(`${EP_EMOJI[l]} ${l} 제품이 ${list.length}개예요 (보통 ${EP_EXPECT[l]}개)`);
      else if (brands.size !== EP_EXPECT_BRANDS[l]) warnings.push(`${EP_EMOJI[l]} ${l} 브랜드가 ${brands.size}개예요 (보통 ${EP_EXPECT_BRANDS[l]}개)`);
    });
    if (!items.length) errors.push("11행부터 제품을 하나도 못 읽었어요");
    // 라벨 순서대로 정렬 (같은 라벨 안에서는 엑셀 순서 유지)
    items.sort((a, b) => EP_LABELS.indexOf(a.label) - EP_LABELS.indexOf(b.label) || a.line - b.line);
    return { sheetName, title, series, upload_date, reel_url, pick_comment, items, errors, warnings };
  }

  function seriesChip(s) {
    const color = s === "가심비" ? "background:#ff3d9a;color:#fff;" : "background:#c6ff3d;color:#191817;";
    return `<span class="tag-chip" style="${color}">${esc(s || "?")}</span>`;
  }
  function labelCounts(items) {
    return EP_LABELS.map((l) => `${EP_EMOJI[l]} ${items.filter((x) => x.label === l).length}`).join(" · ");
  }

          10행 제목: 라벨 · 브랜드 · 제품명 · 큐레이터 링크 · 사진 링크 → 11행부터 제품 30줄 (오른쪽 참고용 열은 무시해요)

    main.querySelector("#ep-template").addEventListener("click", downloadEpisodeTemplate);

  function showEpisodePreview(main, eps, skipped, existing) {
    const box = main.querySelector("#ep-preview");

      if (!ep.errors.length) seen.add(ep.title);
      ep.existing = existing.find((x) => x.title === ep.title) || null;
      ep.thumbFile = null;
    });
    const good = eps.filter((ep) => !ep.errors.length);
    const itemTotal = good.reduce((a, ep) => a + ep.items.length, 0);

    box.innerHTML = `
      <div style="margin-top:14px;">
        <p style="font-size:13px;font-weight:800;margin:0 0 8px;">시트 ${eps.length}개 읽음 → 등록 가능 <span style="color:var(--accent)">${good.length}편</span> (제품 ${itemTotal}개)</p>
        ${skipped.length ? `<p class="empty-note" style="margin:0 0 8px;">B4 제목이 비어서 건너뛴 시트: ${skipped.map(esc).join(", ")}</p>` : ""}
        ${eps.map((ep, i) => `
          <div class="ep-prev ${ep.errors.length ? "bad" : ""}" data-i="${i}">
            <div class="ep-prev-head">
              <div class="ep-prev-thumb" id="ep-thumb-${i}">${ep.existing && ep.existing.thumbnail_url ? `<img src="${esc(ep.existing.thumbnail_url)}">` : "썸네일<br>없음"}</div>
              <div class="info" style="flex:1;min-width:0;">
                <p class="t1" style="margin:0;font-size:13.5px;font-weight:800;">${seriesChip(ep.series)}${esc(ep.title || "(제목 없음)")} ${ep.existing ? `<span class="tag-chip" style="background:#fff1d6;color:#a86a00;">덮어쓰기</span>` : `<span class="tag-chip" style="background:#e9f7ec;color:#1f6b35;">새 편</span>`}</p>
                <p class="t2" style="margin:3px 0 0;font-size:12px;color:var(--fg-muted);">시트 "${esc(ep.sheetName)}" · ${esc(ep.upload_date || "날짜?")} · ${labelCounts(ep.items)}</p>
                ${ep.pick_comment ? `<p style="margin:4px 0 0;font-size:12px;">👑 "${esc(ep.pick_comment)}"</p>` : ""}
                ${ep.errors.length ? "" : `<label class="btn ghost file-btn" style="margin-top:8px;">썸네일 고르기 (9:16)<input type="file" accept="image/*" data-thumb="${i}" hidden></label>`}
              </div>
            </div>
            ${ep.errors.map((t) => `<p class="msg-err">⛔ ${esc(t)}</p>`).join("")}
            ${ep.warnings.map((t) => `<p class="msg-warn">⚠️ ${esc(t)}</p>`).join("")}
            <details style="margin-top:8px;"><summary style="font-size:12px;cursor:pointer;color:var(--fg-muted);">제품 ${ep.items.length}개 보기</summary>
              <table class="mini-table"><tbody>
                ${ep.items.map((it) => `<tr><td>${EP_EMOJI[it.label] || "❓"} ${esc(it.label)}</td><td><b>${esc(it.brand)}</b></td><td>${esc(it.product_name)}</td><td>${it.image_url ? `<img src="${esc(it.image_url)}" style="width:28px;height:34px;object-fit:cover;border-radius:4px;" referrerpolicy="no-referrer">` : "-"}</td></tr>`).join("")}
              </tbody></table>
            </details>
          </div>
        `).join("")}
        ${good.length ? `<button class="btn accent" id="ep-commit" type="button">${good.length}편 등록하기 (제품 ${itemTotal}개)</button>` : `<p class="msg-err">⛔ 등록할 수 있는 편이 없어요. 위 빨간 줄을 고친 뒤 다시 올려주세요.</p>`}

      </div>

    box.querySelectorAll("[data-thumb]").forEach((input) => {
      input.addEventListener("change", (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const i = Number(input.dataset.thumb);
        eps[i].thumbFile = f;
        const url = URL.createObjectURL(f);
        box.querySelector(`#ep-thumb-${i}`).innerHTML = `<img src="${url}">`;
      });

    const commit = box.querySelector("#ep-commit");
    if (commit) commit.addEventListener("click", async () => {

      }
    });

  function downloadEpisodeTemplate() {
    const rows = [
      ["광만두 추천템 등록 양식 — 시트 하나 = 편 하나 (시트를 복사해서 여러 편을 한 파일에 넣어도 돼요)"],
      [],
      [],
      ["제목", "가성비 데님 팬츠"],
      ["시리즈", "가성비"],
      ["업로드 날짜", "2026-11-16"],
      ["릴스 링크", "https://www.instagram.com/reel/..."],
      ["옷쟁이 한마디", "이건 진짜 내가 매일 입는 바지"],
      [],
      ["라벨", "브랜드", "제품명", "큐레이터 링크", "사진 링크"],
    ];
    const plan = [["🍚 국밥", 9], ["🔥 힙함", 9], ["🤍 남친룩", 9], ["👑 옷쟁이", 3]];
    plan.forEach(([label, n]) => { for (let i = 0; i < n; i++) rows.push([label, "", "", "", ""]); });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 14 }, { wch: 18 }, { wch: 34 }, { wch: 40 }, { wch: 40 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "1편");
    XLSX.writeFile(wb, "추천템-편-양식.xlsx");
  }

  // ---------- 편 수정 ----------

      <div class="panel">
        <h2>편 정보</h2>
        <div class="row-flex" style="align-items:flex-start;gap:16px;">
          <div>
            <div class="ep-prev-thumb" id="ee-thumb" style="width:72px;">${ep.thumbnail_url ? `<img src="${esc(ep.thumbnail_url)}">` : "썸네일<br>없음"}</div>
            <label class="btn ghost file-btn" style="margin-top:6px;">변경<input type="file" accept="image/*" id="ee-thumb-file" hidden></label>
          </div>
          <div style="flex:1;min-width:0;">
            <div class="field"><label>제목</label><input id="ee-title" value="${esc(ep.title)}"></div>
            <div class="grid2">
              <div class="field"><label>시리즈</label><select id="ee-series">${["가성비", "가심비"].map((s) => `<option ${s === ep.series ? "selected" : ""}>${s}</option>`).join("")}</select></div>
              <div class="field"><label>업로드 날짜</label><input type="date" id="ee-date" value="${esc(ep.upload_date)}"></div>
            </div>
          </div>
        </div>
        <div class="field"><label>릴스 링크</label><input id="ee-reel" value="${esc(ep.reel_url || "")}" placeholder="https://www.instagram.com/reel/..."></div>
        <div class="field"><label>옷쟁이 한마디</label><input id="ee-comment" value="${esc(ep.pick_comment || "")}"></div>
      </div>
      <div class="panel">
        <h2>제품 (<span id="ee-count"></span>)</h2>
        <div id="ee-items"></div>
        <button class="btn ghost" id="ee-add" type="button" style="margin-top:6px;">+ 제품 추가</button>
      </div>
      <button class="btn accent" id="ee-save">수정 저장</button>
      <button class="btn ghost" id="ee-cancel" style="margin-left:8px;">취소</button>
      <div id="ee-msg" style="margin-top:10px;"></div>
    `;

    const itemsBox = main.querySelector("#ee-items");
    function addItemRow(it) {
      it = it || { label: "국밥" };
      const row = document.createElement("div");
      row.className = "ee-row";
      row.innerHTML = `
        <select class="ee-label">${EP_LABELS.map((l) => `<option value="${l}" ${l === it.label ? "selected" : ""}>${EP_EMOJI[l]} ${l}</option>`).join("")}</select>
        <input class="ee-brand" placeholder="브랜드" value="${esc(it.brand || "")}">
        <input class="ee-name" placeholder="제품명" value="${esc(it.product_name || "")}">
        <input class="ee-link" placeholder="큐레이터 링크 https://..." value="${esc(it.curator_url || "")}">
        <input class="ee-img" placeholder="사진 링크 https://..." value="${esc(it.image_url || "")}">
        <button type="button" class="btn danger ee-rm" title="이 제품 삭제">✕</button>
      `;
      row.querySelector(".ee-rm").addEventListener("click", () => { row.remove(); updateCount(); });
      itemsBox.appendChild(row);
      updateCount();
    }
    function updateCount() { main.querySelector("#ee-count").textContent = `${itemsBox.children.length}개`; }
    (itRes.data || []).forEach(addItemRow);
    if (!itemsBox.children.length) addItemRow();

    main.querySelector("#ee-add").addEventListener("click", () => addItemRow());
    const back = (e) => { if (e) e.preventDefault(); renderEpisodesPage(main); };
    main.querySelector("#ep-back").addEventListener("click", back);
    main.querySelector("#ee-cancel").addEventListener("click", back);
    main.querySelector("#ee-thumb-file").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      thumbFile = f;
      main.querySelector("#ee-thumb").innerHTML = `<img src="${URL.createObjectURL(f)}">`;
    });

    main.querySelector("#ee-save").addEventListener("click", async () => {
      const btn = main.querySelector("#ee-save");
      const msg = main.querySelector("#ee-msg");
      const meta = {
        title: main.querySelector("#ee-title").value.trim(),
        series: main.querySelector("#ee-series").value,
        upload_date: main.querySelector("#ee-date").value,
        reel_url: main.querySelector("#ee-reel").value.trim(),
        pick_comment: main.querySelector("#ee-comment").value.trim(),
      };
      const errs = [];
      if (!meta.title) errs.push("제목을 입력해주세요");
      if (!meta.upload_date) errs.push("업로드 날짜를 입력해주세요");
      if (meta.reel_url && !/^https?:\/\//i.test(meta.reel_url)) errs.push("릴스 링크는 https:// 로 시작해야 해요");
      const items = [];
      [...itemsBox.children].forEach((row, i) => {
        const it = {
          label: row.querySelector(".ee-label").value,
          brand: row.querySelector(".ee-brand").value.trim(),
          product_name: row.querySelector(".ee-name").value.trim(),
          curator_url: row.querySelector(".ee-link").value.trim(),
          image_url: row.querySelector(".ee-img").value.trim(),
        };
        if (!it.brand && !it.product_name && !it.curator_url) return; // 빈 줄은 무시
        if (!it.brand || !it.product_name) errs.push(`${i + 1}번째 제품: 브랜드와 제품명을 채워주세요`);
        if (!/^https?:\/\//i.test(it.curator_url)) errs.push(`${i + 1}번째 제품: 큐레이터 링크가 https:// 로 시작해야 해요`);
        if (it.image_url && !/^https?:\/\//i.test(it.image_url)) errs.push(`${i + 1}번째 제품: 사진 링크가 https:// 로 시작해야 해요`);
        items.push(it);
      });
      if (errs.length) { msg.innerHTML = errs.map((t) => `<p class="msg-err">⛔ ${esc(t)}</p>`).join(""); return; }
      items.sort((a, b) => EP_LABELS.indexOf(a.label) - EP_LABELS.indexOf(b.label));
      btn.disabled = true; btn.textContent = "저장 중…";
      try {
        let thumbUrl;
        if (thumbFile) thumbUrl = (await uploadImageFile(thumbFile, "thumbs", 1080)).url;
        await saveEpisode(meta, items, thumbUrl, ep.id);
      } catch (err) {
        btn.disabled = false; btn.textContent = "수정 저장";
        msg.innerHTML = `<p class="msg-err">⛔ ${esc(friendlyError(err))}</p>`;
        return;
      }
      await renderEpisodesPage(main);
      flashDone(main, `"${meta.title}" 수정 완료`);
    });
  }
  const { data: sessionData } = await supabaseClient.auth.getSession();
  if (sessionData && sessionData.session) {
    loggedIn = true;
    renderShell();
  } else {
    renderLogin();
  }
}

const ROOT_EL = document.getElementById("app-root");
renderAdminApp(ROOT_EL);
</script>
</body>
</html>
